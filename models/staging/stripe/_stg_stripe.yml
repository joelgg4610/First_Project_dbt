models:
  - name: stg_stripe__payment
    columns:
      - name: payment_id
        data_tests:
          - unique 
          - not_null
      - name: order_id
        data_tests:
          - relationships:
              arguments: 
                to: ref('stg_jaffle_shop__orders')
                field: order_id
          - not_null 
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments: 
                values:
                  - credit_card
                  - bank_transfer
                  - coupon 
                  - gift_card
          - not_null
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments: 
                values: ['success', 'fail']
          - not_null
      - name: payment_amount
        data_tests:
          - not_null 
      - name: payment_created
        data_tests:
          - not_null
      - name: _batched_at
        data_tests:
          - not_null    